services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: viralytiq-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-viralytiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-viralytiq}
      POSTGRES_DB: ${POSTGRES_DB:-viralytiq}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viralytiq -d viralytiq"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: infrastructure/backend.Dockerfile
    container_name: viralytiq-backend
    env_file:
      - ../backend/.env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-viralytiq}:${POSTGRES_PASSWORD:-viralytiq}@postgres:5432/${POSTGRES_DB:-viralytiq}
      SYNC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-viralytiq}:${POSTGRES_PASSWORD:-viralytiq}@postgres:5432/${POSTGRES_DB:-viralytiq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: http://langfuse:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ..
      dockerfile: infrastructure/frontend.Dockerfile
    container_name: viralytiq-frontend
    environment:
      FASTAPI_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  langfuse:
    image: langfuse/langfuse:2
    container_name: viralytiq-langfuse
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-viralytiq}:${POSTGRES_PASSWORD:-viralytiq}@postgres:5432/${POSTGRES_DB:-viralytiq}
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-change-me-in-production}
      SALT: ${LANGFUSE_SALT:-change-me-salt}
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: viralytiq-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/viralytiq.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
